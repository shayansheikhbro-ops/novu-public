<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvo – Work, money, habits</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

</head>
<body>
<div class="app">
<header>
 <div class="logo">nuvo<b>.</b></div>
 <div class="tabs" id="tabs" role="tablist"><span class="pill" id="pill"></span>
  <button data-v="board" class="on">Board</button><button data-v="money">Money</button><button data-v="habits">Habits</button>
 </div>
</header>

<div class="view on" id="board">
 <h2>Project board</h2><p class="sub">Drag cards between columns, or use the arrows on a phone.</p>
 <form class="bar" id="cf"><input id="ct" placeholder="New task title" maxlength="70" aria-label="Task title"><select id="cp" aria-label="Priority"><option value="high">High</option><option value="mid" selected>Medium</option><option value="low">Low</option></select><button class="btn">Add task</button></form>
 <div class="cols" id="cols"></div>
</div>

<div class="view" id="money">
 <h2>Money tracker</h2><p class="sub">Log income and spending. Your balance and chart update instantly.</p>
 <form class="bar" id="mf"><input id="mt" placeholder="Description" maxlength="40" aria-label="Description"><input id="ma" type="number" min="1" step="1" placeholder="Amount" style="max-width:120px" aria-label="Amount"><select id="mc" aria-label="Category"><option>Income</option><option>Food</option><option>Bills</option><option>Travel</option><option>Fun</option></select><button class="btn">Add entry</button></form>
 <div class="mgrid">
  <div class="panel"><div style="color:var(--mute)">Balance</div><div class="bal" id="bal">0</div>
   <div class="kpis"><span class="in" id="kin"></span><span class="out" id="kout"></span></div>
   <div class="donutbox" style="margin-top:22px"><svg viewBox="0 0 120 120" id="donut"></svg><div class="leg" id="leg"></div></div></div>
  <div class="panel"><h3 style="margin:0 0 6px;font:600 15px Sora">Recent entries</h3><div id="txs"></div></div>
 </div>
</div>

<div class="view" id="habits">
 <h2>Habit streaks</h2><p class="sub">Tap a day to mark it done. Build a streak and watch it grow.</p>
 <form class="bar" id="hf"><input id="hn" placeholder="New habit, e.g. Read 20 pages" maxlength="40" aria-label="Habit name"><button class="btn">Add habit</button></form>
 <div class="panel"><div style="display:flex;justify-content:space-between"><b>This week</b><span id="hp" style="color:var(--sand);font-weight:800">0%</span></div><div class="prog"><i id="hbar"></i></div><div id="hl"></div></div>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
